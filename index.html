<!doctype html><html lang="en" data-theme="synthwave" data-mode="dark"><head><meta charset="utf-8"><title>Taktaka</title>
<style>

*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg) center/cover;color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden}

select.f,button.b,label.b{background:#8882;color:var(--tx);border:1px solid #8884;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}button.p,label.p{background:var(--ac);border-color:var(--ac);color:#fff}

h2{margin:6px 0 0;font-size:16px}#log{font:12px monospace;background:#0008;color:#9f9;border-radius:8px;padding:10px;height:240px;overflow:auto;white-space:pre-wrap}

.dm[hidden]{display:none}.di{padding:9px 12px;border-radius:6px;cursor:pointer}.di:hover{background:#8883}.di.sel{color:var(--ac);font-weight:600}.pc.dd{cursor:pointer}
nav svg,#tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#tb svg{width:16px;height:16px}nav svg{pointer-events:none}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px;padding:4px 8px}
#bgimg{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;opacity:var(--bgo,1)}.seg{display:flex;gap:6px}.help p{margin:4px 0 14px;line-height:1.8}

body{text-shadow:0 1px 3px color-mix(in srgb,var(--bg) 75%,transparent)}button,input,label,select{text-shadow:none}
[data-mode=light] .pc,[data-mode=light] .th{border:1px solid #0000001a;box-shadow:0 1px 4px #00000012}
.thg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.th{display:grid;gap:8px}.th .sw{display:block;height:36px;border-radius:6px;border:1px solid #8884;background:linear-gradient(135deg,var(--p0) 0 40%,var(--p1) 40% 62%,var(--p2) 62%)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}.tile{position:relative;height:66px;border-radius:8px;background:#8883 center/cover;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;font-size:12px;color:var(--mu)}.tile.on{border-color:var(--ac)}
.tile .x{position:absolute;top:3px;right:3px;background:#000b;color:#fff;border-radius:50%;width:20px;height:20px;padding:0;font-size:11px;line-height:20px}
.mo{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:100}.mb{background:color-mix(in srgb,var(--card),#000 15%);border:1px solid #8885;border-radius:12px;padding:18px;width:min(420px,88vw);display:grid;gap:14px}.mb p{margin:0;line-height:1.6}
main{padding-left:max(28px,calc((100% - 780px)/2));padding-right:max(28px,calc((100% - 780px)/2));scrollbar-width:none}main::-webkit-scrollbar{display:none}
.side{position:fixed;top:44px;bottom:70px;width:8px;-webkit-app-region:drag;z-index:40}.side.l{left:6px}.side.r{right:6px}
#grip{position:fixed;right:2px;bottom:2px;width:18px;height:18px;cursor:nwse-resize;z-index:60;opacity:.75;background:linear-gradient(135deg,transparent 48%,var(--mu) 48%,var(--mu) 56%,transparent 56%,transparent 68%,var(--mu) 68%,var(--mu) 76%,transparent 76%,transparent 88%,var(--mu) 88%)}
.banner:active{transform:scale(.94)}
.banner.logo{height:auto;display:block}.banner.logo img{display:block;width:100%;height:auto;max-height:280px;object-fit:contain}
#log{direction:ltr;text-align:left}
</style></head><body>
<div id="bgimg"></div>
<div id="tb"><span>Taktaka</span><span class="v">v1.0.0</span><span class="s"></span>
<button data-win="min" aria-label="Minimize"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg></button><button data-win="hide" aria-label="Hide to system tray"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button><button data-win="close" aria-label="Quit"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button></div>
<main id="main"></main>
<footer>Latency ≈ <span id="lat">–</span> ms · 32-voice pool</footer>
<nav id="nav"></nav>
<div class="side l"></div><div class="side r"></div><div id="grip" title="Drag to resize" aria-label="Resize window"></div>
<script>
const $=s=>document.querySelector(s), POOL=32, TABS=[['Home','home'],['Sound packs','music'],['Customize','pal'],['Mood','cloud'],['Settings','sl']];
// ---------- storage: Realm via IPC in Electron, localStorage fallback in browser ----------
const mem={};
const DB=window.mvdx?window.mvdx.db:{
  settings:async()=>JSON.parse(localStorage.mvdx||'{}'),
  set:async(k,v)=>{const s=JSON.parse(localStorage.mvdx||'{}');s[k]=v;localStorage.mvdx=JSON.stringify(s)},
  packs:async()=>Object.values(mem).map(p=>({id:p.id,meta:p.meta})),pack:async id=>mem[id].audio,
  save:async p=>{mem[p.id]=p},del:async id=>{delete mem[id]}};
let S={kbPack:'cherry',msPack:'click',kbVol:85,msVol:70,kbPitch:true,msPitch:true,amb:'Rain',ambVol:30,ambOn:false,
 theme:'classic',light:false,op:80,bg:'',logo:'',out:'',muted:false,verbose:false,telemetry:true,kbOn:true,msOn:true,tab:'Home',ambs:[],top:false,bgo:100,helpLang:'ar',imgs:[],hidden:[],pitch:20,boost:false,autoUse:false,lang:'en'};
const save=(k,v)=>{S[k]=v;DB.set(k,v)};
// ---------- logging ----------
const LOG=[];const log=(m,v)=>{if(v&&!S.verbose)return;LOG.push(`[${new Date().toISOString().slice(11,23)}] ${m}`);if(LOG.length>400)LOG.shift();const e=$('#log');if(e){e.textContent=LOG.join('\n');e.scrollTop=1e9}};
onerror=(m,s,l)=>log('JS error: '+m+' (line '+l+')');
// ---------- synth (built-in packs + ambiance) ----------
function click(sr,P){const n=sr*P.len|0,d=new Float32Array(n);for(let i=0;i<n;i++){const t=i/sr;
 d[i]=(Math.sin(6.28*P.f*t*(1+.3*Math.exp(-t*80)))*P.tone+(Math.random()*2-1)*P.noise*Math.exp(-t*P.nd))*Math.exp(-t*P.dec)}return d}
const KEYS=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(c=>'Key'+c).concat([...'0123456789'].map(c=>'Digit'+c),
 Array.from({length:12},(_,i)=>'F'+(i+1)),['Enter','Space','Backspace','Escape','Tab','ShiftLeft','ShiftRight','ControlLeft','AltLeft','CapsLock','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
const MKEYS=['MouseLeft','MouseRight','MouseMiddle','WheelUp','WheelDown'];
function mk(ctx,id,name,type,keys,P){const sr=ctx.sampleRate,slot=.12,defs={},parts=[];let t=0;
 for(const k of keys){defs[k]={timing:[]};for(let v=0;v<2;v++){parts.push(click(sr,{...P,f:P.f*(1+(Math.random()-.5)*.1)}));defs[k].timing.push([t*1e3,(t+P.len)*1e3]);t+=slot}}
 const d=new Float32Array(Math.ceil(t*sr));parts.forEach((p,i)=>d.set(p,Math.round(i*slot*sr)));
 const b=ctx.createBuffer(1,d.length,sr);b.copyToChannel(d,0);
 return{id,name,type,author:'Built-in',version:'1.0.0',builtin:true,buffer:b,config:{config_version:'2',id,name,soundpack_type:type,definition_method:'single',definitions:defs}}}
function amb(ctx,name){const sr=ctx.sampleRate,n=sr*8,b=ctx.createBuffer(2,n,sr);
 for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0,br=0;for(let i=0;i<n;i++){const w=Math.random()*2-1,t=i/sr;lp+=(w-lp)*.25;br=(br+.02*w)/1.02;
  d[i]=name==='Rain'?lp*.5+(Math.random()<.0004?w:0)*.8:name==='Ocean'?br*9*(.55+.45*Math.sin(6.283*t/4)):name==='Fire'?lp*.08+(Math.random()<.0007?w*1.2:0):br*6*(.6+.4*Math.sin(6.283*t*3/8+c))}}return b}
// ---------- audio engine ----------
let ctx,gains={},voices=[],packs={},ambSrc,lats=[];
function builtins(){
 packs.cherry=mk(ctx,'cherry','Cherry MX Black','Keyboard',KEYS,{f:120,tone:.9,noise:.6,nd:300,dec:35,len:.12});
 packs.blue=mk(ctx,'blue','Blue Clicky','Keyboard',KEYS,{f:1800,tone:.5,noise:1,nd:200,dec:45,len:.1});
 packs.click=mk(ctx,'click','Click Classic','Mouse',MKEYS,{f:2200,tone:.5,noise:.8,nd:500,dec:70,len:.08});
 packs.soft=mk(ctx,'soft','Soft Click','Mouse',MKEYS,{f:700,tone:.8,noise:.3,nd:400,dec:60,len:.08});
 for(const id of S.hidden||[])delete packs[id]}
function initAudio(){if(ctx)return;ctx=new AudioContext({latencyHint:0});
 for(const k of['kb','ms','amb']){gains[k]=ctx.createGain();gains[k].connect(ctx.destination)}
 {const n=ctx.sampleRate,b=ctx.createBuffer(1,n,n),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()-.5)*1e-4;const s=ctx.createBufferSource();s.buffer=b;s.loop=true;s.connect(ctx.destination);s.start()}
 builtins();
 applyGain();if(S.out&&ctx.setSinkId)ctx.setSinkId(S.out).catch(()=>{});setAmb();log('engine: audio context started (resample-on-load)')}
function applyGain(){if(!ctx)return;const m=S.muted?0:1;const cap=S.boost?200:100,e=x=>Math.min(x,cap)/100;gains.kb.gain.value=m*e(S.kbVol);gains.ms.gain.value=m*e(S.msVol);gains.amb.gain.value=m*e(S.ambVol);if(ambEl&&!ambNode){ambEl.volume=Math.min(1,S.ambVol/100);ambEl.muted=S.muted}}
let ambEl,ambNode;
function setAmb(){ambSrc&&ambSrc.stop();ambSrc=null;ambEl&&ambEl.pause();if(!S.ambOn||!ctx)return;
 const u=S.amb.startsWith('u:')&&S.ambs.find(a=>'u:'+a.id===S.amb);
 if(u){if(!ambEl){ambEl=new Audio();ambEl.loop=true}const fb=ambEl.dataset.fb;
  ambEl.onerror=()=>{if(ambNode||ambEl.dataset.fb)return;ambEl.dataset.fb=1;ambEl.crossOrigin=null;ambEl.src=u.url;applyGain();ambEl.play().catch(()=>{});log('ambiance: direct mode (max 100%)')};
  ambEl.oncanplay=()=>{if(!ambNode&&!ambEl.dataset.fb){ambNode=ctx.createMediaElementSource(ambEl);ambNode.connect(gains.amb);ambEl.volume=1;ambEl.muted=false;applyGain()}};
  if(fb||!u.file){ambEl.crossOrigin=u.file?null:'anonymous';ambEl.src=u.url}else{ambEl.crossOrigin='anonymous';ambEl.src='tkt://media/'+encodeURIComponent(u.file.split(/[\/]/).pop())}
  applyGain();ambEl.play().catch(e=>log('ambiance failed: '+e.message));return}
 ambSrc=ctx.createBufferSource();ambSrc.buffer=amb(ctx,S.amb);ambSrc.loop=true;ambSrc.connect(gains.amb);ambSrc.start()}
function play(kind,code){if(S.muted||!S[kind+'On'])return;initAudio();if(ctx.state!=='running')ctx.resume();const t0=performance.now();
 const pk=packs[S[kind+'Pack']];if(!pk)return;const df=pk.config.definitions;const def=df[code]||Object.values(df)[0];
 const [a,e]=def.timing[Math.random()*def.timing.length|0];
 if(voices.length>=POOL){const o=voices.shift(),n=ctx.currentTime;o.g.gain.linearRampToValueAtTime(0,n+.04);o.s.stop(n+.05);log('pool: soft-evict oldest voice (fade 40 ms)',1)}
 const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=pk.buffer;
 s.playbackRate.value=S[kind+'Pitch']?1+(Math.random()<.5?-1:1)*(S.pitch/100)*(.7+.3*Math.random()):1;
 s.connect(g);g.connect(gains[kind]);const now=ctx.currentTime,dur=(e-a)/1e3/s.playbackRate.value;
 g.gain.setValueAtTime(1,now+Math.max(0,dur-.008));g.gain.linearRampToValueAtTime(0,now+dur);s.start(now,a/1e3,(e-a)/1e3);s.stop(now+dur+.01);
 const v={s,g};voices.push(v);s.onended=()=>{const i=voices.indexOf(v);i>=0&&voices.splice(i,1)};
 const l=performance.now()-t0+(ctx.baseLatency+(ctx.outputLatency||0))*1e3;lats.push(l);if(lats.length>20)lats.shift();
 $('#lat').textContent=(lats.reduce((x,y)=>x+y,0)/lats.length).toFixed(0);log(`${kind==='kb'?'key':'mouse'} ${code} → voice ${String(voices.length).padStart(2,'0')} latency ${l.toFixed(1)} ms`,1)}
// ---------- input ----------
let globalHook=false;const kindOf=c=>/^(Mouse|Wheel)/.test(c)?'ms':'kb';
let pt;const press=on=>{const b=document.querySelector('.banner');if(!b)return;b.classList.toggle('press',on);clearTimeout(pt);if(on)pt=setTimeout(()=>b.classList.remove('press'),600)};
const hit=(k,c,fx)=>{if(fx)press(true);play(k,c)};
addEventListener('keyup',()=>{if(!globalHook)press(false)});addEventListener('mouseup',()=>{if(!globalHook)press(false)});
addEventListener('keydown',e=>{if(!globalHook&&!e.repeat&&!/INPUT|SELECT/.test(e.target.tagName))hit('kb',e.code,1)});
addEventListener('mousedown',e=>{if(!globalHook&&e.target.closest('main')&&!/BUTTON|SELECT|INPUT/.test(e.target.tagName))hit('ms',['MouseLeft','MouseMiddle','MouseRight'][e.button],!!e.target.closest('.banner'))});
addEventListener('wheel',e=>{if(!globalHook)hit('ms',e.deltaY<0?'WheelUp':'WheelDown')},{passive:true});
log(window.mvdx?'bridge: ok':'bridge: MISSING (preload failed) - window buttons cannot work');
if(window.mvdx){mvdx.hook().then(h=>{globalHook=h;log(h?'input: global hook active':'input: window-only mode')});
 mvdx.onInput(d=>{if(d.up){if(d.kind==='kb')press(false);return}const k=d.kind||kindOf(d.code);hit(k,d.code,k==='kb')});mvdx.onMute(()=>{save('muted',!S.muted);applyGain();ui()})}
// ---------- devices ----------
async function outputs(){try{return(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audiooutput')}catch{return[]}}
navigator.mediaDevices&&(navigator.mediaDevices.ondevicechange=async()=>{const ds=await outputs();if(!ctx||!ctx.setSinkId||!S.out)return;
 const has=ds.some(d=>d.deviceId===S.out);if(!has){await ctx.setSinkId('');log('output device removed → fallback to system default')}else{await ctx.setSinkId(S.out);log('output device restored → switched back')}if(S.tab.startsWith('Audio'))ui()});
// ---------- soundpack import (V2 single) ----------
async function addPack(config,raw){initAudio();const copy=raw.slice(0),buffer=await ctx.decodeAudioData(raw);
 packs[config.id]={id:config.id,name:config.name,type:config.soundpack_type||'Keyboard',author:config.author||'?',version:config.version||'',config,buffer};return copy}
async function importPack(files){files=[...files];const cf=files.find(f=>f.name==='config.json');if(!cf)return alert('config.json not found');
 const c=JSON.parse(await cf.text());if(c.config_version!=='2'||c.definition_method!=='single')return alert('Only V2 "single" packs supported (V1 conversion not included)');
 const af=files.find(f=>f.name===c.audio_file);if(!af)return alert('audio file missing: '+c.audio_file);
 const copy=await addPack(c,await af.arrayBuffer());await DB.save({id:c.id,meta:JSON.stringify(c),audio:new Uint8Array(copy)});log('pack loaded: '+c.id+' (resample-on-load ✓)');ui()}
async function loadSaved(){initAudio();for(const p of await DB.packs()){try{const u=await DB.pack(p.id);const raw=u.buffer?u.buffer.slice(u.byteOffset,u.byteOffset+u.byteLength):u;await addPack(JSON.parse(p.meta),raw)}catch(e){log('pack failed: '+p.id)}}}
$('#grip').addEventListener('mousedown',async e=>{if(!window.mvdx)return;e.preventDefault();const[w0,h0]=await mvdx.size(),x0=e.screenX,y0=e.screenY;
 const mv=ev=>mvdx.win('resize',Math.max(420,w0+ev.screenX-x0),Math.max(520,h0+ev.screenY-y0));

async function addImg(files,kind){for(const f of files){const name=f.name.replace(/\.[^.]+$/,'');let rec;const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 if(window.mvdx&&mvdx.img){const r=await mvdx.img.add(mvdx.path(f));rec={id,name,kind,file:r.file,url:r.url}}
 else rec={id,name,kind,url:await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(f)})};
 save('imgs',[...S.imgs,rec]);save(kind,rec.url);log('image added: '+name)}ui()}
async function addSound(files,type){initAudio();for(const f of files){try{const raw=await f.arrayBuffer(),buf=await ctx.decodeAudioData(raw.slice(0));
 const dur=Math.min(buf.duration,3)*1e3,defs={};(type==='Keyboard'?KEYS:MKEYS).forEach(k=>defs[k]={timing:[[0,dur]]});
 const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),name=f.name.replace(/\.[^.]+$/,'');
 const config={config_version:'2',id,name,author:'Custom',version:'1.0.0',soundpack_type:type,definition_method:'single',audio_file:f.name,definitions:defs};
 const copy=await addPack(config,raw);await DB.save({id,meta:JSON.stringify(config),audio:new Uint8Array(copy)});
 if(S.autoUse)save(type==='Keyboard'?'kbPack':'msPack',id);log('sound added: '+name)}catch(e){alert('Could not read "'+f.name+'" as audio')}}ui()}

{const _u=ui;ui=function(){_u();tr(document.body)}}
async function addAmb(files){for(const f of files){const name=f.name.replace(/\.[^.]+$/,'');let rec;
 if(window.mvdx&&mvdx.amb){const r=await mvdx.amb.add(mvdx.path(f));rec={id:r.id,name,file:r.file,url:r.url}}else rec={id:Date.now()+'',name,url:URL.createObjectURL(f)};
 save('ambs',[...S.ambs,rec]);log('ambiance added: '+name)}ui()}
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;initAudio();
 const v=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;
 if(t.type==='range'){S[k]=v;applyGain();css();const lb=document.getElementById('v-'+k);if(lb)lb.textContent=v+'%';else{const p=t.previousElementSibling;p.textContent=v+'%';p.classList.toggle('hot',v>100);t.classList.toggle('hot',v>100)}return}
 save(k,v);if(k==='boost'&&!v)for(const x of['kbVol','msVol','ambVol'])if(S[x]>100)save(x,100);applyGain();if(k==='top'&&window.mvdx)mvdx.win('top',v);ui()});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.k;if(k&&t.type==='range'){DB.set(k,S[k]);if(/Vol$/.test(k))log(`${k} → gain ×${(S[k]/100).toFixed(2)}`)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='all'){save('muted',!t.checked);applyGain()}
 if(t.id==='imp')importPack(t.files);if(t.id==='ambup')addAmb(t.files);
 if(t.id==='sndkb')addSound(t.files,'Keyboard');if(t.id==='sndms')addSound(t.files,'Mouse');
 if(t.id==='imgbg')addImg(t.files,'bg');if(t.id==='imglogo')addImg(t.files,'logo');
 if(t.dataset.img){const r=new FileReader();r.onload=()=>{save(t.dataset.img,r.result);ui()};r.readAsDataURL(t.files[0])}});
document.addEventListener('click',async e=>{const di=e.target.closest('.di'),d=e.target.closest('.dd');
 document.querySelectorAll('.dm').forEach(m=>{m.hidden=!(d&&!di&&m.parentElement===d&&m.hidden)});
 if(di){const k=d.dataset.dd,v=di.dataset.v;save(k,v);initAudio();
  if(k==='out'){ctx.setSinkId&&await ctx.setSinkId(v);ambEl&&ambEl.setSinkId&&ambEl.setSinkId(v).catch(()=>{});log('output → '+(v||'system default'))}
  if(k==='amb')setAmb();ui();return}
 const t=e.target.closest('[data-tab],[data-th],[data-del],[data-mute],[data-shuf],[data-win],[data-img-clear],[data-ambdel],[data-lang],[data-pick],[data-imgdel],[data-ui],#restore,#ambBtn,#exp');if(!t)return;
 if(t.dataset.lang){save('helpLang',t.dataset.lang);ui()}
 if(t.dataset.tab){save('tab',t.dataset.tab);ui()}
 if(t.dataset.th){save('theme',t.dataset.th);ui()}
 if(t.dataset.mute){save(t.dataset.mute+'On',!S[t.dataset.mute+'On']);ui()}
 if(t.dataset.shuf){const l=pk(t.dataset.shuf==='kb'?'Keyboard':'Mouse');if(l.length)save(t.dataset.shuf+'Pack',l[Math.random()*l.length|0].id);ui()}
 if(t.dataset.win&&window.mvdx)mvdx.win(t.dataset.win);
 if(t.id==='ambBtn'){initAudio();save('ambOn',!S.ambOn);setAmb();ui()}
 if(t.dataset.ui){save('lang',t.dataset.ui);save('helpLang',t.dataset.ui);ui()}
 if(t.dataset.pick){save(t.dataset.pick,t.dataset.url);ui()}
 if(t.dataset.imgdel){const i=S.imgs.find(x=>x.id===t.dataset.imgdel);if(i&&await ask('Delete image "'+i.name+'" from Taktaka? This cannot be undone.')){
  i.file&&window.mvdx&&mvdx.img.del(i.file);save('imgs',S.imgs.filter(x=>x!==i));if(S.bg===i.url)save('bg','');if(S.logo===i.url)save('logo','');ui()}}
 if(t.dataset.ambdel){const a=S.ambs.find(x=>x.id===t.dataset.ambdel);if(a&&await ask('Delete sound "'+a.name+'" from Taktaka? This cannot be undone.')){
  a.file&&window.mvdx&&mvdx.amb.del(a.file);save('ambs',S.ambs.filter(x=>x!==a));if(S.amb==='u:'+a.id){save('amb','Rain');setAmb()}ui()}}
 if(t.dataset.del){const p=packs[t.dataset.del];if(p&&await ask(p.builtin?'Remove built-in sound pack "'+p.name+'"? You can restore it from the Sound packs page.':'Delete sound pack "'+p.name+'" from Taktaka? This cannot be undone.')){
  if(p.builtin)save('hidden',[...S.hidden,p.id]);else DB.del(p.id);delete packs[p.id];
  for(const [key,ty] of[['kbPack','Keyboard'],['msPack','Mouse']])if(S[key]===p.id){const f=Object.values(packs).find(x=>x.type===ty);save(key,f?f.id:'')}ui()}}
 if(t.id==='restore'){save('hidden',[]);builtins();ui()}
 if(t.hasAttribute('data-img-clear')){save('bg','');save('logo','');ui()}
 if(t.id==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([LOG.join('\n')]));a.download='mechvibesdx-log.txt';a.click()}});

 S.hidden=S.hidden||[];S.hidden.forEach(id=>delete packs[id]);for(const k of['kbPack','msPack'])if(!packs[S[k]]){const f=Object.values(packs).find(x=>x.type===(k==='kbPack'?'Keyboard':'Mouse'));S[k]=f?f.id:''}if(S.op<15)S.op=15;ui()})();
